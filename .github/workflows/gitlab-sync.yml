name: GitLab Release Sync

on:
  schedule:
    # Runs every 30 minutes
    - cron: '*/30 * * * *'
  workflow_dispatch: # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GITLAB_PROJECT_ID: "88821849"
      GITLAB_URL: "https://gitlab.com"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check and Sync Latest GitLab Release
        run: |
          # Fetch releases from GitLab API
          RESPONSE=$(curl -s "$GITLAB_URL/api/v4/projects/$GITLAB_PROJECT_ID/releases")
          
          # Extract details of the latest release (first item in the array)
          LATEST_TAG=$(echo "$RESPONSE" | jq -r '.[0].tag_name // empty')
          RELEASE_NAME=$(echo "$RESPONSE" | jq -r '.[0].name // empty')
          DESCRIPTION=$(echo "$RESPONSE" | jq -r '.[0].description // empty')

          # Stop if no release is found
          if [ -z "$LATEST_TAG" ]; then
            echo "No releases found on GitLab."
            exit 0
          fi

          # Check if the release already exists on GitHub
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            echo "Release $LATEST_TAG is already up to date on GitHub."
            exit 0
          fi

          echo "New release found: $LATEST_TAG. Downloading assets..."

          # Create directory for assets
          mkdir -p release_assets
          
          # Download attached binary/custom asset links
          ASSET_URLS=$(echo "$RESPONSE" | jq -r '.[0].assets.links[]?.direct_asset_url // .[0].assets.links[]?.url // empty')
          for url in $ASSET_URLS; do
            if [ -n "$url" ]; then
              echo "Downloading asset: $url"
              wget -q -P release_assets "$url"
            fi
          done

          # Download source code archive (zip)
          SOURCE_ZIP=$(echo "$RESPONSE" | jq -r '.[0].assets.sources[]? | select(.format=="zip") | .url // empty')
          if [ -n "$SOURCE_ZIP" ]; then
            echo "Downloading source zip..."
            wget -q -O "release_assets/source-$LATEST_TAG.zip" "$SOURCE_ZIP"
          fi

          # Save release notes to a markdown file
          printf "%s\n" "$DESCRIPTION" > release_notes.md

          # Set fallback title if release name is empty
          if [ -z "$RELEASE_NAME" ]; then
            RELEASE_NAME="$LATEST_TAG"
          fi

          # Create the release on GitHub and upload files if any exist
          if [ -n "$(ls -A release_assets)" ]; then
            gh release create "$LATEST_TAG" release_assets/* \
              --title "$RELEASE_NAME" \
              --notes-file release_notes.md
          else
            gh release create "$LATEST_TAG" \
              --title "$RELEASE_NAME" \
              --notes-file release_notes.md
          fi

          echo "Successfully synced release $LATEST_TAG to GitHub!"
